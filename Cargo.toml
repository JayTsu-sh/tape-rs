[package]
name = "tape-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.29", features = ["ioctl", "fs"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
bytes = "1"
quick-xml = "0.36"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
