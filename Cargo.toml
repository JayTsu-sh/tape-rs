[package]
name = "tape-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.29", features = ["ioctl", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
bytes = "1"
quick-xml = "0.36"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
protobuf = "2"
slog = "2"
slog-stdlog = "4"
base64 = "0.22"

# HTTP 接入；只启用 HTTP/1，业务与设备执行仍使用现有同步通道。
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
# 集成测试直接查控制存储，验证日志确实被压缩过
rusqlite = { version = "0.31", features = ["bundled"] }

[dependencies.fuser]
# FUSE 适配器 tape-fuse（`--features fuse`）。不用 libfuse：挂载走 fusermount3，库本身纯 Rust
version = "0.18"
optional = true
default-features = false

[features]
fuse = ["dep:fuser"]

[[bin]]
name = "tape-fuse"
required-features = ["fuse"]
